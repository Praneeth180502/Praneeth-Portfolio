version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-oriented values for the container network.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/portfolio_db
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/portfolio_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Persist vector/BM25 indices across container restarts.
      - chroma_data:/app/data/chroma
      - bm25_data:/app/data/bm25
      # Mount knowledge/ so content edits don't require an image rebuild
      # (re-run scripts/ingest_knowledge.py --force after editing).
      - ./knowledge:/app/knowledge:ro
      - ./static:/app/static:ro
    networks:
      - portfolio_net

  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portfolio_net

  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  bm25_data:
